name: Build GOST ARMv7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ARMv7
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          go build -o gost ./cmd/gost
          file gost

      - name: Upload ARMv7 binary
        uses: actions/upload-artifact@v4
        with:
          name: gost-linux-armv7
          path: gost
